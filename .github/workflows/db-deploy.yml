name: DB Deploy (production)

# Applies committed migrations to the PRODUCTION Supabase project AFTER a PR is
# merged to main. This is the ONLY place prod schema changes happen. Secrets live
# in GitHub Actions secrets — never in the repo and never in Claude's context.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

concurrency:
  group: db-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Opt-in gate: stays a no-op until you set repo variable PROD_DB_DEPLOY_ENABLED=true
    # AND add the prod secrets. Prevents red builds before prod is wired up.
    if: vars.PROD_DB_DEPLOY_ENABLED == 'true'
    environment: production # add required reviewers here for a manual approval gate
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref "$SUPABASE_PROD_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}

      - name: Push migrations to production
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
