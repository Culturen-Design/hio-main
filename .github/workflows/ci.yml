name: CI

# Required status check for merging into main. Netlify builds the Deploy Preview
# separately; this gate is lint + types + tests + build + migration safety.
on:
  pull_request: # all PRs, regardless of base (we stage via integration/v2)
  push:
    branches: [main, "integration/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # .npmrc pulls @culturen-design/* (design tokens) from GitHub Packages.
      # GH_PACKAGES_TOKEN is a PAT with read:packages; falls back to
      # GITHUB_TOKEN, which works once the package grants this repo access.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # One Turborepo pass runs lint + typecheck + test + build across every
      # workspace (apps + packages), with caching. Placeholder public env lets the
      # Next builds compile without real secrets; runtime values come from Netlify.
      - name: Lint / typecheck / test / build (turbo)
        run: npx turbo run lint typecheck test build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  edge-bundle:
    # The ai-command edge function is not an npm workspace, so turbo doesn't cover
    # it. Its vendored @hio/* copies are generated from the packages; verify they
    # are in sync so the committed (and therefore deployed) function never drifts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate the ai-command bundle
        run: npm run bundle:ai-command

      - name: Fail if the vendored bundle is out of sync with the packages
        run: |
          if ! git diff --exit-code -- supabase/functions/ai-command/vendor; then
            echo "::error::ai-command vendor/ is stale. Run 'npm run bundle:ai-command' and commit the result."
            exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          # Authenticated GitHub API calls so resolving the CLI release doesn't hit
          # the 60/hr unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint migrations (start local DB + db lint)
        run: |
          supabase start
          supabase db lint --level warning

      - name: Enforce migration immutability
        # Fail if a PR modifies a migration file that already exists on main
        # (applied migrations are append-only — add a new file instead).
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-status origin/${{ github.base_ref }}...HEAD -- supabase/migrations || true)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(M|D|R)' | grep -q 'supabase/migrations/'; then
            echo "::error::A committed migration was modified, deleted, or renamed. Migrations are immutable — create a NEW migration instead."
            exit 1
          fi
