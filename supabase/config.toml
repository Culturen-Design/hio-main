# Supabase local + linked-project config. `project_id` is set when you run
# `supabase link --project-ref <dev-ref>`. Keep this committed.
project_id = "nextjs-supabase-netlify-starter"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Edge Functions. The AI page editor; schema-driven by @hio/ai-engine.
# Secrets (ANTHROPIC_API_KEY, optional ANTHROPIC_MODEL) are set with
# `supabase secrets set` — never committed. Imports resolve via the per-function deno.json.
[functions.ai-command]
verify_jwt = true
import_map = "./functions/ai-command/deno.json"

# Branching (Supabase Pro). Leave disabled until you upgrade — see README cost notes.
[experimental]
# enable per-PR database branching by setting this in the dashboard, not here.
