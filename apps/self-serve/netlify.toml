# Netlify configuration — drives the 3-tier environment model.
# The official Next.js Runtime is auto-installed by Netlify; no plugin entry needed.
#
# NOTE: this site uses Netlify's monorepo "Package directory" feature (set to
# apps/self-serve in the dashboard) with Base directory left at the repo root ("/").
# In that mode, relative paths in this file — e.g. `publish` — resolve against
# BASE directory, not the directory this file lives in. So `publish` must be the
# full path from the repo root, not just ".next".

[build]
  command = "npm run build"
  publish = "apps/self-serve/.next"

[build.environment]
  NODE_VERSION = "20"
  # Fail the build on type/lint errors so broken code never reaches a preview.
  NEXT_TELEMETRY_DISABLED = "1"

# ── Production: deploys from `main` ──────────────────────────────────────────
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://your-domain.com"
  # NEXT_PUBLIC_SUPABASE_URL / ANON_KEY are injected by the Supabase ⇄ Netlify
  # integration, scoped to this context → points at the PROD Supabase project.

# ── Deploy Previews: every pull request gets its own URL ─────────────────────
[context.deploy-preview.environment]
  # Supabase integration injects the DEV project's URL/anon key here (or the
  # per-PR branch values when Supabase Pro branching is enabled).

# ── Branch deploys: long-lived non-main branches (e.g. `staging`) ────────────
[context.branch-deploy.environment]

# Security headers applied to all responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
